schema_version: "1.1"
name: ai-slop-guide
expected_outcome: |
  AI가 쓴 안내문에서 리뷰가 빼도 정보가 줄지 않는 문장(되풀이, 맺음 정리, 예고, 아무도 하지 않은 주장을 부정하는 대구, 일반론, 작업 과정 서술, 문제없는 것 보고, 끝에 붙인 제안)을 찾아 맨 앞의 "AI slop" 섹션에서 빼자고 하고, 줄마다 빼도 되는 이유를 댄다. 중요도, 개수, 독자, 떨어진 섹션 안내, 미정 사항, 정보가 있는 대조 문장은 남기고, 그 밖의 문장도 빼자고 하지 않는다. 빼기로 한 문장에는 다른 줄을 내지 않는다. 팀장 승인을 받기 전에 산 책도 지원하는지 글쓴이에게 묻고, 파일을 고치기 전에 반영 여부를 묻는다.
context:
  scaffold_script: place-files.sh
